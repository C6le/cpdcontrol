<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Centre de contrôle CPD</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales/fr.global.min.js"></script>
<style>
  :root {
    --bleu: #000091; --bleu-clair: #e3e3fd; --bleu-hover: #1212ff;
    --rouge: #c9191e; --rouge-clair: #fee9e9;
    --orange: #b34000; --orange-clair: #fff4e5;
    --vert: #18753c; --vert-clair: #e6f4ea;
    --texte: #1e1e1e; --muted: #666; --bord: #ddd; --fond: #fff; --fond-2: #f6f6f6;
    --rayon: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--fond); color: var(--texte);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--bord); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; color: var(--bleu); white-space: nowrap; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { border: 0; background: none; padding: 6px 10px; border-radius: var(--rayon); cursor: pointer; font: inherit; color: var(--texte); }
  nav button:hover { background: var(--fond-2); }
  nav button.actif { background: var(--bleu-clair); color: var(--bleu); font-weight: 600; }
  .spacer { flex: 1; }
  main { flex: 1; overflow: auto; padding: 14px; }
  button.btn, a.btn { font: inherit; border: 1px solid var(--bleu); background: var(--fond); color: var(--bleu); padding: 5px 10px;
    border-radius: var(--rayon); cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
  button.btn:hover { background: var(--bleu-clair); }
  button.btn.primaire { background: var(--bleu); color: #fff; }
  button.btn.primaire:hover { background: var(--bleu-hover); }
  button.btn.danger { border-color: var(--rouge); color: var(--rouge); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.lien { border: 0; background: none; color: var(--bleu); cursor: pointer; padding: 0; font: inherit; text-align: left; }
  button.lien:hover { text-decoration: underline; }
  input[type=text], input[type=search], input[type=email], input[type=date], select, textarea {
    font: inherit; padding: 5px 8px; border: 1px solid #bbb; border-radius: var(--rayon); background: #fff; color: var(--texte); }
  textarea { width: 100%; font-family: Consolas, monospace; font-size: 12px; }
  label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--bleu); text-transform: uppercase; letter-spacing: .03em; }
  .muted { color: var(--muted); }
  .petit { font-size: 12px; }
  .grille { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .kpi { border: 1px solid var(--bord); border-radius: var(--rayon); padding: 8px 10px; cursor: pointer; }
  .kpi:hover { border-color: var(--bleu); }
  .kpi .v { font-size: 22px; font-weight: 700; color: var(--bleu); }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .deux-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .deux-col { grid-template-columns: 1fr; } }
  .carte { border: 1px solid var(--bord); border-radius: var(--rayon); padding: 10px 12px; }
  .alerte { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--rayon); margin-bottom: 4px; cursor: pointer; }
  .alerte:hover { filter: brightness(.97); }
  .alerte .n { font-weight: 700; min-width: 28px; text-align: right; }
  .alerte.rouge { background: var(--rouge-clair); color: var(--rouge); }
  .alerte.orange { background: var(--orange-clair); color: var(--orange); }
  .alerte.vert { background: var(--vert-clair); color: var(--vert); }
  table.t { border-collapse: collapse; width: 100%; }
  table.t th, table.t td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  table.t th { background: var(--fond-2); position: sticky; top: 0; font-weight: 600; z-index: 1; }
  table.t tr:hover td { background: #fafaff; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; background: var(--fond-2); border: 1px solid var(--bord); margin: 1px 2px 1px 0; white-space: nowrap; }
  .badge.role { background: var(--bleu-clair); border-color: transparent; color: var(--bleu); }
  .badge.vieux { opacity: .55; }
  .pastille { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  /* Recherche */
  .recherche { display: grid; grid-template-columns: 320px 1fr; gap: 14px; height: 100%; }
  @media (max-width: 800px) { .recherche { grid-template-columns: 1fr; } }
  .resultats { border: 1px solid var(--bord); border-radius: var(--rayon); overflow: auto; max-height: calc(100vh - 130px); }
  .res { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .res:hover, .res.sel { background: var(--bleu-clair); }
  .res .t1 { font-weight: 600; }
  .res .t2 { font-size: 12px; color: var(--muted); }
  .fiche { overflow: auto; max-height: calc(100vh - 130px); }
  .fiche .entete { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--bleu); padding-bottom: 6px; margin-bottom: 8px; }
  .fiche .entete h2 { margin: 0; font-size: 18px; }
  dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; }
  ul.simple { margin: 0; padding-left: 18px; }
  .barre { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--bord); border-radius: 14px; padding: 2px 9px; cursor: pointer; user-select: none; font-size: 12px; background: #fff; }
  .chip.on { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  #calendrier { min-height: 560px; }
  .fc { font-size: 12px; }
  .apercu { border: 1px dashed #aaa; border-radius: var(--rayon); padding: 10px; background: #fcfcfc; max-height: 340px; overflow: auto; }
  .apercu .objet { font-weight: 600; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 6px; }
  .inconnu { background: #ffe08a; }
  .ok { color: var(--vert); } .ko { color: var(--rouge); } .warn { color: var(--orange); }
  /* Modale */
  #voile { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 30px 12px; overflow: auto; }
  #voile.ouvert { display: flex; }
  .modale { background: #fff; border-radius: 8px; max-width: 760px; width: 100%; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .modale .pied { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #toast { position: fixed; bottom: 14px; right: 14px; background: #222; color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 60vw; }
  #toast.vu { opacity: .95; }
  .formulaire { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; align-items: center; }
  .formulaire input, .formulaire select, .formulaire textarea { width: 100%; }
  .scroll-table { max-height: 55vh; overflow: auto; border: 1px solid var(--bord); border-radius: var(--rayon); }
  #print-area { display: none; }
  @media print {
    #app, #voile, #toast { display: none !important; }
    #print-area { display: block; }
    .page { page-break-after: always; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Centre de contrôle CPD</h1>
    <nav id="onglets">
      <button data-tab="dash">Tableau de bord</button>
      <button data-tab="search">Recherche</button>
      <button data-tab="cal">Calendrier</button>
      <button data-tab="lists">Listes &amp; envois</button>
      <button data-tab="import">Import</button>
      <button data-tab="settings">Réglages</button>
    </nav>
    <span class="spacer"></span>
    <label class="petit muted">Année <select id="annee"></select></label>
    <button class="btn" id="btn-refresh" title="Recharger les données">⟳</button>
  </header>
  <main id="main"><p class="muted">Chargement…</p></main>
</div>
<div id="voile"><div class="modale" id="modale"></div></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
'use strict';
/* =====================================================================
   1. RÉFÉRENTIELS ET SCHÉMA DU DOCUMENT
   ===================================================================== */
const ROLES = ['PEMF', 'MAT', 'IEN', 'CPC', 'CPD', 'Directeur', 'LPE1', 'LPE2', 'M2E1', 'M2E2', 'MEEF2',
  'T0', 'T1', 'Candidat CAFIPEMF', 'Jury CAFIPEMF', 'Formateur', 'Partenaire', 'Autre'];
const ROLES_ETUDIANTS = ['LPE1', 'LPE2', 'M2E1', 'M2E2', 'MEEF2', 'T0'];
const ROLES_ENCADRANTS = ['PEMF', 'MAT'];
const TYPES_SUIVI = ['Stage filé', 'Stage massé', 'Tutorat PEMF', 'Tutorat T0', 'Visite', 'Accompagnement'];
const CATEGORIES = {
  'Stage': '#1f78b4', 'Formation': '#6a3d9a', 'Conseil IEN': '#b15928', 'CAFIPEMF': '#e31a1c',
  'Réunion': '#33a02c', 'Visite': '#ff7f00', 'Échéance': '#c9191e', 'Examen / jury': '#a6cee3',
  'Vacances': '#999999', 'Autre': '#555555'
};
const CONTEXTES = ['@mail', '@doc', '@Sofia', '@INSPE', '@circo', '@DDA', '@services', '@réunion', '@données'];

const C = (id, type, o = {}) => ({ id, type, ...o });
// Phase 1 : tables dans un ordre sans référence « vers l'avant ».
const SCHEMA = [
  { t: 'Annees', cols: [C('Annee', 'Text'), C('Courante', 'Bool'), C('Debut', 'Date'), C('Fin', 'Date')] },
  { t: 'Parametres', cols: [C('Cle', 'Text'), C('Valeur', 'Text'), C('Description', 'Text')] },
  { t: 'Circonscriptions', cols: [C('Code', 'Text'), C('Nom', 'Text'), C('Nom_court', 'Text'), C('Secteur_DDA', 'Text'),
      C('Notes', 'Text'), C('Libelle', 'Text', { f: '$Nom_court or $Nom' })] },
  { t: 'Ecoles', cols: [C('UAI', 'Text'), C('Nom', 'Text'), C('Type', 'Choice', { ch: ['Maternelle', 'Élémentaire', 'Primaire'] }),
      C('Commune', 'Text'), C('Adresse', 'Text'), C('Code_postal', 'Text'), C('Telephone', 'Text'), C('Mail', 'Text'),
      C('Circonscription', 'Ref:Circonscriptions'), C('Education_prioritaire', 'Text'), C('ULIS', 'Bool'),
      C('Latitude', 'Numeric'), C('Longitude', 'Numeric'), C('Etat', 'Text'), C('Notes', 'Text'),
      C('Libelle', 'Text', { f: '" – ".join(x for x in [$Nom, $Commune] if x)' })] },
  { t: 'Personnes', cols: [C('Civilite', 'Choice', { ch: ['Mme', 'M.'] }), C('Nom', 'Text'), C('Prenom', 'Text'),
      C('Mail_pro', 'Text'), C('Mail_perso', 'Text'), C('Telephone', 'Text'), C('Num_etudiant', 'Text'), C('Fonction', 'Text'),
      C('Ecole', 'Ref:Ecoles'), C('Notes', 'Text'),
      C('Nom_complet', 'Text', { f: '" ".join(x for x in [($Nom or "").upper(), $Prenom] if x)' }),
      C('Mail', 'Text', { f: '$Mail_pro or $Mail_perso' })] },
  { t: 'Roles', cols: [C('Personne', 'Ref:Personnes'), C('Role', 'Choice', { ch: ROLES }), C('Annee', 'Ref:Annees'),
      C('Ecole', 'Ref:Ecoles'), C('Circo_saisie', 'Ref:Circonscriptions'), C('Cycle', 'ChoiceList', { ch: ['1', '2', '3'] }),
      C('Groupe', 'Text'), C('Modalite', 'Text'), C('Decharge', 'Text'), C('Detail', 'Text'),
      C('Circonscription', 'Ref:Circonscriptions', { f: '$Circo_saisie or $Ecole.Circonscription' }),
      C('Courant', 'Bool', { f: 'bool($Annee.Courante)' })] },
  { t: 'Suivis', cols: [C('Etudiant', 'Ref:Personnes'), C('Encadrant', 'Ref:Personnes'), C('Type', 'Choice', { ch: TYPES_SUIVI }),
      C('Annee', 'Ref:Annees'), C('Fenetre', 'Text'), C('Debut', 'Date'), C('Fin', 'Date'), C('Ecole', 'Ref:Ecoles'),
      C('Groupe', 'Text'), C('Statut', 'Choice', { ch: ['Prévu', 'En cours', 'Terminé', 'Annulé'] }), C('Notes', 'Text')] },
  { t: 'Evenements', cols: [C('Titre', 'Text'), C('Categorie', 'Choice', { ch: Object.keys(CATEGORIES) }),
      C('Date_debut', 'Date'), C('Date_fin', 'Date'), C('Heure_debut', 'Text'), C('Heure_fin', 'Text'), C('Lieu', 'Text'),
      C('Publics', 'ChoiceList', { ch: ['Tous', ...ROLES] }), C('Participants', 'RefList:Personnes'),
      C('Circonscription', 'Ref:Circonscriptions'), C('Annee', 'Ref:Annees'),
      C('Statut', 'Choice', { ch: ['Prévu', 'Confirmé', 'Fait', 'Annulé'] }), C('Description', 'Text'), C('Source', 'Text')] },
  { t: 'Actions', cols: [C('Titre', 'Text'), C('Projet', 'Text'), C('Contexte', 'Choice', { ch: CONTEXTES }),
      C('Statut', 'Choice', { ch: ['À faire', 'En attente', 'Fait', 'Abandonné'] }), C('Echeance', 'Date'), C('Relance', 'Date'),
      C('En_attente_de', 'Ref:Personnes'), C('Concerne', 'RefList:Personnes'), C('Notes', 'Text')] },
  { t: 'Modeles', cols: [C('Nom', 'Text'), C('Type', 'Choice', { ch: ['Mail', 'Document'] }), C('Objet', 'Text'),
      C('Corps', 'Text'), C('Notes', 'Text')] },
  { t: 'Envois', cols: [C('Date', 'DateTime:Europe/Paris'), C('Lot', 'Text'), C('Type', 'Choice', { ch: ['Mail', 'Document'] }),
      C('Modele', 'Ref:Modeles'), C('Personne', 'Ref:Personnes'), C('Destinataire', 'Text'), C('Objet', 'Text'),
      C('Statut', 'Choice', { ch: ['En file', 'Envoyé', 'Généré', 'Erreur', 'Test'] }), C('Message', 'Text')] },
];
// Phase 2 : colonnes calculées qui pointent vers des tables créées plus loin.
const SCHEMA_TARDIF = [
  ['Circonscriptions', C('IEN', 'Ref:Personnes', { f: 'r = [x for x in Roles.lookupRecords(Circonscription=$id, Role="IEN") if x.Courant]\nreturn r[0].Personne if r else None' })],
  ['Circonscriptions', C('CPC', 'RefList:Personnes', { f: '[x.Personne for x in Roles.lookupRecords(Circonscription=$id, Role="CPC") if x.Courant]' })],
  ['Circonscriptions', C('Nb_ecoles', 'Int', { f: 'len(Ecoles.lookupRecords(Circonscription=$id))' })],
  ['Circonscriptions', C('Nb_PEMF', 'Int', { f: 'len([x for x in Roles.lookupRecords(Circonscription=$id, Role="PEMF") if x.Courant])' })],
  ['Circonscriptions', C('Nb_MAT', 'Int', { f: 'len([x for x in Roles.lookupRecords(Circonscription=$id, Role="MAT") if x.Courant])' })],
  ['Ecoles', C('Directeur', 'Ref:Personnes', { f: 'r = [x for x in Roles.lookupRecords(Ecole=$id, Role="Directeur") if x.Courant]\nreturn r[0].Personne if r else None' })],
  ['Ecoles', C('IEN', 'Ref:Personnes', { f: '$Circonscription.IEN' })],
  ['Personnes', C('Roles_courants', 'Text', { f: '", ".join(sorted(set(r.Role for r in Roles.lookupRecords(Personne=$id) if r.Courant and r.Role)))' })],
  ['Personnes', C('Circonscription', 'Ref:Circonscriptions', { f: '$Ecole.Circonscription or next((r.Circonscription for r in Roles.lookupRecords(Personne=$id) if r.Courant and r.Circonscription), None)' })],
];
// Colonne affichée dans les cellules de référence.
const AFFICHAGE = { Annees: 'Annee', Circonscriptions: 'Libelle', Ecoles: 'Libelle', Personnes: 'Nom_complet', Modeles: 'Nom' };
const TABLES = SCHEMA.map(s => s.t);

const PARAMS_DEFAUT = [
  ['MAIL_CPD', '', 'Votre adresse : destinataire des tests, du digest hebdo et répondre-à des publipostages'],
  ['N8N_URL_PUBLIPOSTAGE', '', 'URL « Production » du webhook n8n « Publipostage mails »'],
  ['N8N_URL_DOCUMENTS', '', 'URL « Production » du webhook n8n « Documents PDF »'],
  ['N8N_JETON', '', 'Jeton partagé avec n8n (même valeur que dans le nœud Config des workflows)'],
  ['DOSSIER_PDF', '/CPD/Documents générés', 'Dossier Nextcloud où n8n dépose les PDF'],
  ['SIGNATURE', 'La conseillère pédagogique départementale auprès du DASEN', 'Texte inséré par {{Signature}}'],
  ['DEPARTEMENT', '006', "Code département pour l'import des écoles (open data)"],
];
const MODELES_DEFAUT = [
  ['Information stage – encadrant', 'Mail', 'Accueil de stagiaires – {{Annee}}',
   '<p>{{Madame_Monsieur}},</p>\n<p>Je vous remercie d\'accueillir cette année, dans votre classe de l\'école {{Ecole}}, les étudiants suivants :</p>\n<p>{{Etudiants}}</p>\n<p>Votre IEN, {{IEN}}, est informé(e) de cette organisation.</p>\n<p>Bien cordialement,</p>\n<p>{{Signature}}</p>'],
  ['Information stage – étudiant', 'Mail', 'Votre lieu de stage – {{Annee}}',
   '<p>Bonjour {{Prenom}},</p>\n<p>Vous êtes accueilli(e) en stage ({{Role}}, groupe {{Groupe}}) auprès de :</p>\n<p>{{Encadrants}}</p>\n<p>Bien cordialement,</p>\n<p>{{Signature}}</p>'],
  ['Convocation réunion', 'Mail', 'Convocation – réunion du …',
   '<p>{{Madame_Monsieur}},</p>\n<p>Vous êtes convié(e) à la réunion qui se tiendra le … à … (lieu).</p>\n<p>Ordre du jour : …</p>\n<p>{{Signature}}</p>'],
  ['Attestation d\'intervention', 'Document', 'Attestation – {{Nom_complet}}',
   '<h2 style="text-align:center">ATTESTATION</h2>\n<p>Je soussignée, {{Signature}}, atteste que {{Civilite}} {{Nom_complet}}, {{Role}} ({{Ecole}}, circonscription {{Circonscription}}), est intervenu(e) au titre de l\'année scolaire {{Annee}}.</p>\n<p style="margin-top:40px">Fait à Nice, le {{Date_du_jour}}</p>'],
];

/* =====================================================================
   2. OUTILS
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9@.]+/g, ' ').trim();
const cleNom = (...parts) => norm(parts.join(' ')).replace(/[.@]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
const liste = v => (Array.isArray(v) && v[0] === 'L') ? v.slice(1) : [];
const pad = n => String(n).padStart(2, '0');
const JOUR = 86400;
function aujourdhui() { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; }
function fDate(s) { if (s == null || s === '' || typeof s !== 'number') return ''; const d = new Date(s * 1000); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`; }
function isoDate(s) { const d = new Date(s * 1000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function fDateTime(s) { if (!s) return ''; const d = new Date(s * 1000); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dateLongue(d = new Date()) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); }
const MOIS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
function lireDate(v) {
  if (v == null) return null;
  if (typeof v === 'number') return v > 100000 ? v : Math.round((v - 25569) * JOUR);
  const s = String(v).trim(); if (!s) return null;
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return Date.UTC(y, +m[2] - 1, +m[1]) / 1000; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]) / 1000;
  if (/^\d{5}(\.\d+)?$/.test(s)) return Math.round((+s - 25569) * JOUR);
  m = norm(s).match(/(\d{1,2})(?:er)? (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) (\d{4})/);
  if (m) return Date.UTC(+m[3], MOIS.indexOf(m[2]), +m[1]) / 1000;
  return null;
}
function lireHeure(s) {
  const m = String(s || '').match(/(\d{1,2})\s*[h:H]\s*(\d{2})?/);
  return m ? `${pad(+m[1])}:${m[2] || '00'}` : '';
}
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('vu'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('vu'), ms); }
function telecharger(nom, contenu, type = 'text/plain;charset=utf-8') {
  const blob = new Blob([contenu], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copier(texte) {
  try { await navigator.clipboard.writeText(texte); toast('Copié dans le presse-papiers'); return; } catch (e) { /* repli */ }
  const ta = document.createElement('textarea'); ta.value = texte; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* */ }
  ta.remove();

function parseTableau(texte) {
  const lignes = texte.replace(/\r\n?/g, '\n').replace(/\n+$/, '');
  if (!lignes.trim()) return [];
  const premiere = lignes.split('\n')[0];
  const sep = premiere.includes('\t') ? '\t' : ((premiere.match(/;/g) || []).length >= (premiere.match(/,/g) || []).length ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < lignes.length; i++) {
    const c = lignes[i];
    if (q) { if (c === '"') { if (lignes[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function scinderNomComplet(s) {
  // « Morgane ALBIN » ou « ANZIANI Lola » : les mots en capitales forment le nom.
  const mots = String(s || '').trim().split(/\s+/).filter(Boolean);
  const estMaj = w => w.length > 1 && w === w.toUpperCase() && /[A-ZÀ-Ý]/.test(w);
  const nom = mots.filter(estMaj), prenom = mots.filter(w => !estMaj(w));
  if (nom.length && prenom.length) return { Nom: nom.join(' '), Prenom: prenom.join(' ') };
  if (mots.length >= 2) return { Prenom: mots[0], Nom: mots.slice(1).join(' ') };
  return { Nom: mots.join(' '), Prenom: '' };
}

async function reglerAffichageRefs() {
  const tabs = enLignes(await grist.docApi.fetchTable('_grist_Tables'));
  const cols = enLignes(await grist.docApi.fetchTable('_grist_Tables_column'));
  const tableIdDe = new Map(tabs.map(t => [t.id, t.tableId]));
  const colDe = (tableId, colId) => cols.find(c => tableIdDe.get(c.parentId) === tableId && c.colId === colId);
  const actions = [];
  for (const c of cols) {
    const m = String(c.type || '').match(/^(Ref|RefList):(\w+)$/);
    if (!m || !AFFICHAGE[m[2]] || !TABLES.includes(tableIdDe.get(c.parentId))) continue;

    actions.push(['SetDisplayFormula', tableIdDe.get(c.parentId), null, c.id, `$${c.colId}.${AFFICHAGE[m[2]]}`]);

function indexRecherche() {
  const items = [];
  for (const p of D.Personnes) items.push({ type: 'p', id: p.id, t1: nomP(p.id), t2: [rolesDe(p.id).map(r => r.Role).join(', '), libE(p.Ecole)].filter(Boolean).join(' · '),
    k: norm([p.Nom, p.Prenom, p.Mail_pro, p.Mail_perso, p.Num_etudiant, p.Telephone, rolesDe(p.id).map(r => r.Role + ' ' + (r.Groupe || '')).join(' ')].join(' ')) });
  for (const e of D.Ecoles) items.push({ type: 'e', id: e.id, t1: e.Nom, t2: [e.Commune, e.UAI, libC(e.Circonscription)].filter(Boolean).join(' · '), k: norm([e.Nom, e.Commune, e.UAI, e.Code_postal].join(' ')) });
  for (const c of D.Circonscriptions) items.push({ type: 'c', id: c.id, t1: 'Circonscription ' + libC(c.id), t2: nomP(ienDe(c.id)), k: norm(['circonscription circo', c.Nom, c.Nom_court, c.Code].join(' ')) });
  return items;
}
function rendreRecherche() {
  $('#main').innerHTML = `<div class="recherche">
    <div>
      <div class="barre"><input type="search" id="q" placeholder="Nom, mail, école, commune, UAI, groupe…" style="flex:1" value="${esc(S.recherche)}"></div>
      <div class="chips" id="filtre-type" style="margin-bottom:8px">
        ${[['', 'Tout'], ['p', 'Personnes'], ['e', 'Écoles'], ['c', 'Circos']].map(([v, l]) => `<span class="chip ${(S.filtreType || '') === v ? 'on' : ''}" data-v="${v}">${l}</span>`).join('')}
        <span class="spacer"></span><button class="btn" id="btn-nouv-p" title="Créer une personne">+ Personne</button>
      </div>
      <div class="resultats" id="res"></div>
    </div>
    <div class="fiche carte" id="fiche"><p class="muted">Sélectionnez un résultat pour afficher sa fiche.</p></div>
  </div>`;
  const items = indexRecherche();
  const majRes = () => {
    const mots = norm(S.recherche).split(' ').filter(Boolean);
    let r = items.filter(it => (!S.filtreType || it.type === S.filtreType) && mots.every(m => it.k.includes(m)));
    const total = r.length; r = r.slice(0, 200);
    $('#res').innerHTML = r.map(it => `<div class="res ${S.selection && S.selection.type === it.type && S.selection.id === it.id ? 'sel' : ''}" data-ouvrir="${it.type}:${it.id}">
      <div class="t1">${it.type === 'e' ? '🏫 ' : it.type === 'c' ? '🗺️ ' : ''}${esc(it.t1)}</div><div class="t2">${esc(it.t2)}</div></div>`).join('')
      + (total > 200 ? `<div class="res muted">… ${total - 200} autres résultats, affinez la recherche.</div>` : '')
      + (!total ? '<div class="res muted">Aucun résultat.</div>' : '');
  };
  $('#q').oninput = e => { S.recherche = e.target.value; majRes(); };
  document.querySelectorAll('#filtre-type .chip').forEach(c => c.onclick = () => { S.filtreType = c.dataset.v; rendreRecherche(); });
  $('#btn-nouv-p').onclick = () => editerPersonne(null);
  majRes();
  if (S.selection) afficherFiche(S.selection.type, S.selection.id);
  $('#q').focus();
}
function ouvrir(type, id) {
  S.selection = { type, id: +id };
  if (S.onglet !== 'search') { S.onglet = 'search'; $('#voile').classList.remove('ouvert'); rendre(); return; }
  document.querySelectorAll('.res').forEach(r => r.classList.toggle('sel', r.dataset.ouvrir === `${type}:${id}`));
  afficherFiche(type, +id);
}
function afficherFiche(type, id) {
  const el = $('#fiche'); if (!el) return;
  el.innerHTML = type === 'p' ? fichePersonne(id) : type === 'e' ? ficheEcole(id) : ficheCirco(id);
  el.querySelectorAll('[data-edit-p]').forEach(b => b.onclick = () => editerPersonne(+b.dataset.editP));
  el.querySelectorAll('[data-add-role]').forEach(b => b.onclick = () => ajouterRole(+b.dataset.addRole));
  el.querySelectorAll('[data-add-suivi]').forEach(b => b.onclick = () => ajouterSuivi(+b.dataset.addSuivi));
  el.querySelectorAll('[data-copier]').forEach(b => b.onclick = () => copier(b.dataset.copier));
  el.scrollTop = 0;
}
function evenementsPour({ personneId = null, circoId = null, ecoleId = null }) {
  const auj = aujourdhui();
  const p = personneId ? P(personneId) : null;
  const roles = p ? new Set(rolesDe(p.id).map(r => r.Role)) : new Set();
  const circo = p ? circoDe(p) : circoId;
  return D.Evenements.filter(e => {
    if (!e.Date_debut || (e.Date_fin || e.Date_debut) < auj || e.Statut === 'Annulé') return false;
    if (e.Circonscription && circo && e.Circonscription !== circo) return false;
    if (p) { if (liste(e.Participants).includes(p.id)) return true; const pub = liste(e.Publics); return pub.includes('Tous') || pub.some(x => roles.has(x)); }
    if (circoId || ecoleId) return e.Circonscription === circo;
    return false;
  }).sort((a, b) => a.Date_debut - b.Date_debut).slice(0, 12);
}
function tableEvts(evts) {

}

  const html = `<div class="formulaire">${champs.map(([k, l]) => k === 'Civilite'
      ? `<label>${l}</label><select id="f-${k}"><option></option>${['Mme', 'M.'].map(c => `<option ${p[k] === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`

  else { const r = await agir([['AddRecord', 'Personnes', null, f]], 'Personne créée'); S.selection = { type: 'p', id: r.retValues[0] }; }
  rendre();
}

function exporterIcs() {
  const echap = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const compact = s => s.replace(/[-:]/g, '');
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lignes = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CPD ADASEN//Centre de controle//FR', 'CALSCALE:GREGORIAN'];
  for (const e of evenementsFiltres()) {
    const h1 = lireHeure(e.Heure_debut), h2 = lireHeure(e.Heure_fin); const fin = e.Date_fin && e.Date_fin >= e.Date_debut ? e.Date_fin : e.Date_debut;
    lignes.push('BEGIN:VEVENT', `UID:cpd-evt-${e.id}@centre-controle`, `DTSTAMP:${now}`);
    if (h1) { lignes.push(`DTSTART:${compact(isoDate(e.Date_debut))}T${h1.replace(':', '')}00`); lignes.push(`DTEND:${compact(isoDate(fin))}T${(h2 || h1).replace(':', '')}00`); }
    else { lignes.push(`DTSTART;VALUE=DATE:${compact(isoDate(e.Date_debut))}`, `DTEND;VALUE=DATE:${compact(isoDate(fin + JOUR))}`); }
    lignes.push(`SUMMARY:${echap(e.Titre)}`, `CATEGORIES:${echap(e.Categorie)}`);
    if (e.Lieu) lignes.push(`LOCATION:${echap(e.Lieu)}`);
    if (e.Description) lignes.push(`DESCRIPTION:${echap(e.Description)}`);
    lignes.push('END:VEVENT');
  }
  lignes.push('END:VCALENDAR');
  telecharger('calendrier-cpd.ics', lignes.join('\r\n'), 'text/calendar;charset=utf-8');
}

function trouverEcole(uai, texte) {

  if (!texte) return null;
  const [partNom, partCommune] = String(texte).split(/\s+[-–]\s+/);
  const jetons = s => new Set(norm(s).split(' ').filter(w => w && !MOTS_VIDES.has(w)));

    const en = jetons(e.Nom), ec = jetons(e.Commune);
    let inter = 0; for (const w of jn) if (en.has(w) || ec.has(w)) inter++;
    let score = jn.size ? inter / Math.max(jn.size, en.size) : 0;

      if (!nom) { ops.push({ statut: 'erreur', msg: 'nom manquant', resume: l.join(' | ').slice(0, 80) }); continue; }
      const ecole = trouverEcole(o.UAI, o.Ecole_nom), circo = trouverCirco(o.Circo);
      const civ = /^(mme|madame|mlle|f)/i.test(o.Civilite || '') ? 'Mme' : /^(m|mr|monsieur|h)\b/i.test(o.Civilite || '') ? 'M.' : '';
      const extra = { Civilite: civ, Mail_pro: o.Mail_pro || '', Mail_perso: o.Mail_perso || '', Telephone: o.Telephone || '', Num_etudiant: o.Num_etudiant || '', Fonction: o.Fonction || '', Ecole: ecole || 0 };
      const pers = resoudre(nom, prenom, [o.Mail_pro, o.Mail_perso], extra);
      const role = normRole(o.Role, I.role); const cyc = lireCycles(o.Cycle);
      const dejaRole = pers.existe && rolesDe(pers.id).some(r => r.Role === role);
      ops.push({ statut: !pers.existe ? 'nouveau' : dejaRole ? 'existant' : 'complété', pers, extra,
        role: dejaRole ? null : { Role: role, Annee: S.annee, Ecole: 0, Circo_saisie: !ecole && circo ? circo : 0, Groupe: o.Groupe || '', Cycle: cyc.length ? ['L', ...cyc] : null, Modalite: o.Modalite || '', Decharge: o.Decharge || '', Detail: o.Detail || '' },
        resume: `${(nom || '').toUpperCase()} ${prenom} · ${role}${o.Groupe ? ' · ' + o.Groupe : ''}`,
        msg: [(o.UAI || o.Ecole_nom) && !ecole ? `école non reconnue : « ${o.Ecole_nom || o.UAI} »` : '', ecole ? '🏫 ' + libE(ecole) : '', o.Circo && !circo ? `circo non reconnue : « ${o.Circo} »` : ''].filter(Boolean).join(' · ') });
    }
  } else {
    const vus = new Set();
    for (const l of I.lignes) {
      const o = lireLigne(l);
      let en = o.Encadrant_nom || '', ep = o.Encadrant_prenom || '';
      if (!en && o.Encadrant) ({ Nom: en, Prenom: ep } = scinderNomComplet(o.Encadrant));
      if (!en || !(o.Etudiant || []).length) { ops.push({ statut: 'erreur', msg: 'encadrant ou étudiant manquant', resume: l.join(' | ').slice(0, 80) }); continue; }
      const ecole = trouverEcole(o.UAI, o.Ecole_nom), circo = trouverCirco(o.Circo), cyc = lireCycles(o.Cycle);
      const enc = resoudre(en, ep, [], { Ecole: ecole || 0 });
      const encMaj = enc.existe && ecole && !(P(enc.id) || {}).Ecole ? ecole : 0;
      const encRole = !enc.existe || !rolesDe(enc.id).some(r => r.Role === I.roleEnc || ROLES_ENCADRANTS.includes(r.Role) || r.Role === 'Formateur') ? { Role: I.roleEnc, Annee: S.annee, Circo_saisie: !ecole && circo ? circo : 0, Cycle: cyc.length ? ['L', ...cyc] : null } : null;
      for (const etuTxt of o.Etudiant) {
        const { Nom: n, Prenom: p } = scinderNomComplet(etuTxt);
        const etu = resoudre(n, p, [], {});
        const cle = `${enc.id || enc.tmp}|${etu.id || etu.tmp}|${o.Fenetre || I.fenetre}`;
        const doublon = (enc.existe && etu.existe && D.Suivis.some(s => s.Annee === S.annee && s.Encadrant === enc.id && s.Etudiant === etu.id && (s.Fenetre || '') === (o.Fenetre || I.fenetre))) || vus.has(cle);
        vus.add(cle);
        const etuRole = !etu.existe || !rolesDe(etu.id).some(r => r.Role === I.roleEtu || ROLES_ETUDIANTS.includes(r.Role)) ? { Role: I.roleEtu, Annee: S.annee, Groupe: o.Groupe || '' } : null;
        ops.push({ statut: doublon ? 'existant' : 'nouveau', enc, etu, encRole, etuRole, encMaj,
          suivi: doublon ? null : { Type: normType(o.Type) || I.type, Fenetre: o.Fenetre || I.fenetre, Groupe: o.Groupe || '', Debut: lireDate(o.Debut), Fin: lireDate(o.Fin), Annee: S.annee, Statut: 'Prévu', Ecole: 0 },
          resume: `${etuTxt} → ${en.toUpperCase()} ${ep} · ${o.Fenetre || I.fenetre}${o.Groupe ? ' · ' + o.Groupe : ''}`,
          msg: [!enc.existe ? 'encadrant créé' : '', !etu.existe ? 'étudiant créé' : '', (o.UAI || o.Ecole_nom) && !ecole ? `école non reconnue : « ${o.Ecole_nom || o.UAI} »` : ecole ? '🏫 ' + libE(ecole) : ''].filter(Boolean).join(' · ') });
      }
    }
  }
  ops.nouvelles = nouvelles;
  return ops;
}
function normType(v) { const n = norm(v); if (!n) return ''; return TYPES_SUIVI.find(t => norm(t) === n) || (/masse/.test(n) ? 'Stage massé' : /file/.test(n) ? 'Stage filé' : /t0/.test(n) ? 'Tutorat T0' : /visite/.test(n) ? 'Visite' : ''); }
function rendreApercuImport() {
  const ops = S.imp.apercu; const n = s => ops.filter(o => o.statut === s).length;
  const nbNouvPers = ops.nouvelles ? ops.nouvelles.size : 0;
  $('#imp-apercu').innerHTML = `<h3>Aperçu</h3><p>
    <span class="ok">${n('nouveau')} nouvelle(s) ligne(s)</span> · ${n('complété')} complétée(s) · <span class="muted">${n('existant')} déjà présente(s)</span> · <span class="ko">${n('erreur')} en erreur</span>
    ${S.imp.cible !== 'evenements' ? ` · <b>${nbNouvPers}</b> personne(s) à créer` : ''}</p>
    <div class="scroll-table"><table class="t"><tr><th>Statut</th><th>Ligne</th><th>Remarques</th></tr>
    ${ops.map(o => `<tr><td class="${o.statut === 'erreur' ? 'ko' : o.statut === 'existant' ? 'muted' : 'ok'}">${o.statut}</td><td>${esc(o.resume)}</td><td class="petit ${/non reconnue/.test(o.msg) ? 'warn' : 'muted'}">${esc(o.msg || '')}</td></tr>`).join('')}
    </table></div>
    <div class="barre" style="margin-top:8px"><button class="btn primaire" id="imp-go" ${ops.some(o => o.statut === 'nouveau' || o.statut === 'complété') ? '' : 'disabled'}>Importer dans Grist</button></div>`;
  $('#imp-go').onclick = executerImport;
}
async function executerImport() {
  const I = S.imp, ops = I.apercu; const bouton = $('#imp-go'); bouton.disabled = true; bouton.textContent = 'Import en cours…';
  try {
    if (I.cible === 'evenements') {
      const ev = ops.filter(o => o.statut === 'nouveau').map(o => o.evt);
      const cols = Object.keys(ev[0]); const data = {}; for (const c of cols) data[c] = ev.map(e => e[c]);
      await agir([['BulkAddRecord', 'Evenements', ev.map(() => null), data]], `${ev.length} événement(s) importé(s)`);
    } else {
      // 1. Personnes nouvelles
      const nouv = [...ops.nouvelles.values()]; const tmpId = new Map();
      if (nouv.length) {
        const cols = ['Nom', 'Prenom', 'Civilite', 'Mail_pro', 'Mail_perso', 'Telephone', 'Num_etudiant', 'Fonction', 'Ecole'];
        const data = {}; for (const c of cols) data[c] = nouv.map(n => n.fields[c] ?? (c === 'Ecole' ? 0 : ''));
        const r = await grist.docApi.applyUserActions([['BulkAddRecord', 'Personnes', nouv.map(() => null), data]]);
        r.retValues[0].forEach((id, i) => tmpId.set(nouv[i].tmp, id));
      }
      const idDe = x => x.existe ? x.id : tmpId.get(x.tmp);
      const actions = []; const rolesVus = new Set();
      const ajouterRole = (pid, role) => { const k = `${pid}|${role.Role}`; if (rolesVus.has(k)) return; rolesVus.add(k); const f = { ...role }; delete f._fait; actions.push(['AddRecord', 'Roles', null, { Personne: pid, ...f }]); };
      for (const o of ops) {
        if (o.statut === 'erreur') continue;
        if (I.cible === 'personnes') {
          const pid = idDe(o.pers);
          if (o.pers.existe) { // compléter les champs vides
            const p = P(pid); const maj = {};
            for (const [k, v] of Object.entries(o.extra)) if (v && !p[k]) maj[k] = v;
            if (Object.keys(maj).length) actions.push(['UpdateRecord', 'Personnes', pid, maj]);
          }
          if (o.role) ajouterRole(pid, o.role);
        } else {
          const enc = idDe(o.enc), etu = idDe(o.etu);
          if (o.encRole) ajouterRole(enc, o.encRole);
          if (o.encMaj && !rolesVus.has('ecole|' + enc)) { rolesVus.add('ecole|' + enc); actions.push(['UpdateRecord', 'Personnes', enc, { Ecole: o.encMaj }]); }
          if (o.etuRole) ajouterRole(etu, o.etuRole);
          if (o.suivi) actions.push(['AddRecord', 'Suivis', null, { ...o.suivi, Encadrant: enc, Etudiant: etu }]);
        }
      }
      if (actions.length) await grist.docApi.applyUserActions(actions);
      await charger(); toast(`Import terminé : ${nouv.length} personne(s) créée(s), ${actions.length} opération(s)`, 4000);
    }
    I.apercu = null; I.mapping = null; I.texte = ''; rendreImport();
  } catch (e) { console.error(e); bouton.disabled = false; bouton.textContent = 'Importer dans Grist'; modale('Erreur d\'import', `<p class="ko">${esc(e.message || e)}</p>`); }
}

/* =====================================================================
   11. RÉGLAGES (structure, année, paramètres, écoles open data)
   ===================================================================== */
function rendreReglages() {
  const manq = S.manquantes || [];
  $('#main').innerHTML = `<div class="deux-col">
    <div>
      <div class="carte"><h2>Structure du document</h2>
        ${manq.length ? `<p class="ko">Tables manquantes : ${manq.join(', ')}</p><button class="btn primaire" id="r-init">Créer les tables manquantes</button>` : `<p class="ok">Les ${TABLES.length} tables sont présentes.</p>`}
        <button class="btn" id="r-refs">Réparer l'affichage des références</button></div>
      <div class="carte" style="margin-top:12px"><h2>Année scolaire courante</h2>
        <p class="muted petit">Pilote les colonnes calculées (IEN de la circo, directeur, rôles courants) et l'année affichée par défaut.</p>
        <div class="barre"><select id="r-annee">${D.Annees.map(a => `<option value="${a.id}" ${a.Courante ? 'selected' : ''}>${esc(a.Annee)}</option>`).join('')}</select>
          <button class="btn primaire" id="r-annee-ok">Définir comme courante</button>
          <button class="btn" id="r-annee-add">+ année suivante</button></div></div>
      <div class="carte" style="margin-top:12px"><h2>Écoles et circonscriptions (open data)</h2>
        <p class="muted petit">Source : Annuaire de l'éducation (data.education.gouv.fr), écoles publiques ouvertes du département <b>${esc(param('DEPARTEMENT') || '006')}</b>. Met à jour coordonnées et rattachement de circonscription ; ne touche ni aux notes ni aux noms courts déjà saisis.</p>
        <button class="btn primaire" id="r-ecoles">Importer / mettre à jour les écoles</button> <span id="r-ecoles-etat" class="muted"></span>
        <p class="muted petit">${D.Ecoles.length} écoles, ${D.Circonscriptions.length} circonscriptions dans le document.</p></div>
    </div>
    <div class="carte"><h2>Paramètres</h2>
      <div class="formulaire">${D.Parametres.map(p => `<label title="${esc(p.Description || '')}">${esc(p.Cle)}</label><input type="${/JETON/.test(p.Cle) ? 'password' : 'text'}" data-param="${p.id}" value="${esc(p.Valeur || '')}" placeholder="${esc(p.Description || '')}">`).join('')}</div>
      <div class="barre" style="margin-top:10px"><button class="btn primaire" id="r-params">Enregistrer</button>
        <button class="btn" id="r-ping">Tester la connexion n8n</button>
        <button class="btn" id="r-jeton">Générer un jeton</button></div>
      <p class="muted petit">Les modèles de mails et de documents se modifient directement dans la table <b>Modeles</b> (HTML accepté, champs <code>{{Prenom}}</code>, <code>{{Ecole}}</code>…).</p>
    </div></div>`;
  const b = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  b('#r-init', initialiser);
  b('#r-refs', async () => { await reglerAffichageRefs(); toast('Références réglées'); });
  b('#r-annee-ok', async () => { const id = +$('#r-annee').value; await agir([['BulkUpdateRecord', 'Annees', D.Annees.map(a => a.id), { Courante: D.Annees.map(a => a.id === id) }]], 'Année courante modifiée'); S.annee = id; remplirAnnees(); rendre(); });
  b('#r-annee-add', async () => { const der = [...D.Annees].sort((a, b) => String(a.Annee).localeCompare(String(b.Annee))).pop(); const y = der ? +String(der.Annee).slice(0, 4) + 1 : new Date().getFullYear();
    await agir([['AddRecord', 'Annees', null, { Annee: `${y}-${y + 1}`, Courante: false, Debut: Date.UTC(y, 8, 1) / 1000, Fin: Date.UTC(y + 1, 7, 31) / 1000 }]], `Année ${y}-${y + 1} ajoutée`); rendre(); });
  b('#r-params', async () => { const ids = [], vals = []; document.querySelectorAll('[data-param]').forEach(i => { ids.push(+i.dataset.param); vals.push(i.value.trim()); });
    await agir([['BulkUpdateRecord', 'Parametres', ids, { Valeur: vals }]], 'Paramètres enregistrés'); });
  b('#r-jeton', () => { const a = new Uint8Array(24); crypto.getRandomValues(a); const j = [...a].map(x => x.toString(16).padStart(2, '0')).join('');
    const champ = [...document.querySelectorAll('[data-param]')].find(i => (IDX.Parametres.get(+i.dataset.param) || {}).Cle === 'N8N_JETON');
    if (champ) { champ.value = j; champ.type = 'text'; } toast('Jeton généré : enregistrez, puis copiez-le dans le nœud Config des workflows n8n', 5000); });
  b('#r-ping', async () => { const cfg = verifierN8n('N8N_URL_PUBLIPOSTAGE'); if (!cfg) return;
    try { await posterN8n(cfg.url, { jeton: cfg.jeton, lot: 'PING', messages: [] }); toast('n8n a bien reçu la requête ✔'); } catch (e) { modale('Connexion n8n impossible', `<p class="ko">${esc(e.message || e)}</p><p class="muted">Causes fréquentes : workflow inactif, URL de test au lieu de production, blocage CORS (option « Allowed Origins » du nœud Webhook).</p>`); } });
  b('#r-ecoles', importerEcoles);
}
function nomCourtCirco(nom) {
  let s = String(nom || '').replace(/^circonscription\s+(d'inspection\s+)?(de l'enseignement\s+)?(du\s+)?(1er|premier)\s+degr[ée]\s*/i, '').trim();
  const art = [[/^de la /i, 'La '], [/^de l['’]/i, "L'"], [/^du /i, 'Le '], [/^des /i, 'Les '], [/^de /i, ''], [/^d['’]/i, '']];
  for (const [re, rep] of art) if (re.test(s)) { s = s.replace(re, rep); break; }
  return s || nom;
}
async function importerEcoles() {
  const etat = $('#r-ecoles-etat'); const dep = (param('DEPARTEMENT') || '006').padStart(3, '0');
  etat.textContent = 'Téléchargement…';
  try {
    const where = `code_departement="${dep}" and type_etablissement="Ecole" and statut_public_prive="Public" and etat="OUVERT"`;
    const select = 'identifiant_de_l_etablissement,nom_etablissement,ecole_maternelle,ecole_elementaire,adresse_1,code_postal,nom_commune,telephone,mail,ulis,appartenance_education_prioritaire,latitude,longitude,etat,code_circonscription,nom_circonscription';
    const url = `https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/exports/json?where=${encodeURIComponent(where)}&select=${select}`;
    const rep = await fetch(url); if (!rep.ok) throw new Error('Open data : ' + rep.status);
    const data = await rep.json(); etat.textContent = `${data.length} écoles reçues, mise à jour…`;
    // Circonscriptions
    const circos = new Map(); for (const d of data) if (d.code_circonscription) circos.set(d.code_circonscription, d.nom_circonscription);
    const parCode = new Map(D.Circonscriptions.map(c => [c.Code, c]));
    const addC = [...circos].filter(([code]) => !parCode.has(code));
    const updC = [...circos].filter(([code, nom]) => parCode.has(code) && parCode.get(code).Nom !== nom);
    const act1 = [];
    if (addC.length) act1.push(['BulkAddRecord', 'Circonscriptions', addC.map(() => null), { Code: addC.map(x => x[0]), Nom: addC.map(x => x[1]), Nom_court: addC.map(x => nomCourtCirco(x[1])) }]);
    if (updC.length) act1.push(['BulkUpdateRecord', 'Circonscriptions', updC.map(x => parCode.get(x[0]).id), { Nom: updC.map(x => x[1]) }]);
    if (act1.length) await grist.docApi.applyUserActions(act1);
    await charger();
    const idCirco = new Map(D.Circonscriptions.map(c => [c.Code, c.id]));
    // Écoles
    const parUai = new Map(D.Ecoles.map(e => [e.UAI, e]));
    const champs = d => ({ UAI: d.identifiant_de_l_etablissement, Nom: d.nom_etablissement,
      Type: d.ecole_maternelle && d.ecole_elementaire ? 'Primaire' : d.ecole_maternelle ? 'Maternelle' : 'Élémentaire',
      Commune: d.nom_commune || '', Adresse: d.adresse_1 || '', Code_postal: d.code_postal || '', Telephone: d.telephone || '', Mail: d.mail || '',
      Circonscription: idCirco.get(d.code_circonscription) || 0, Education_prioritaire: d.appartenance_education_prioritaire || '', ULIS: !!d.ulis,
      Latitude: d.latitude ?? null, Longitude: d.longitude ?? null, Etat: d.etat || '' });
    const nouv = [], maj = [];
    for (const d of data) { const f = champs(d); const ex = parUai.get(f.UAI); if (ex) maj.push([ex.id, f]); else nouv.push(f); }
    const cols = Object.keys(champs(data[0] || {})); const act2 = [];
    const colonne = (arr, c) => arr.map(f => f[c]);
    if (nouv.length) { const o = {}; for (const c of cols) o[c] = colonne(nouv, c); act2.push(['BulkAddRecord', 'Ecoles', nouv.map(() => null), o]); }
    if (maj.length) { const o = {}; for (const c of cols) o[c] = maj.map(x => x[1][c]); act2.push(['BulkUpdateRecord', 'Ecoles', maj.map(x => x[0]), o]); }
    if (act2.length) await grist.docApi.applyUserActions(act2);
    await charger();
    etat.innerHTML = `<span class="ok">✔ ${nouv.length} école(s) ajoutée(s), ${maj.length} mise(s) à jour, ${addC.length} circonscription(s) créée(s).</span>`;
  } catch (e) { console.error(e); etat.innerHTML = `<span class="ko">Erreur : ${esc(e.message || e)}</span>`; }
}

});
document.querySelectorAll('#onglets button').forEach(b => b.onclick = () => { S.onglet = b.dataset.tab; rendre(); });

$('#voile').addEventListener('click', e => { if (e.target.id === 'voile') $('#voile').classList.remove('ouvert'); });

grist.ready({ requiredAccess: 'full', allowSelectBy: false });
grist.onRecords(() => { if (S.pret) rechargerPlusTard(); });
window.addEventListener('focus', () => { if (S.pret) rechargerPlusTard(); });
(async () => {
  try { await charger(); S.pret = true; rendre(); }
  catch (e) {
    console.error(e);
    $('#main').innerHTML = `<div class="carte"><h2 class="ko">Accès au document impossible</h2><p>${esc(e.message || e)}</p>
      <p>Dans le panneau de droite de Grist, onglet <b>Widget</b>, réglez l'accès sur <b>« Accès complet au document »</b>, puis rechargez.</p></div>`;
  }
})();
